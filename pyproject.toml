[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-accountant"
version = "0.1.0"
description = "AI accounting employee for Odoo 19 with an auditable approval gate"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Legacy .xls (OLE2) statements only. Pinned; pure-python, no formula/macro execution.
xls = ["xlrd==2.0.1"]

[project.scripts]
odoo-accountant = "odoo_accountant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
